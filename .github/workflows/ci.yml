name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Pinned explicitly: never trust the runner's default Xcode. Bump this
    # (and the xcode-select step below) when the project's Xcode requirement
    # changes.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          path: |
            Packages/Synchrony/.build
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/Synchrony/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Install SwiftLint and swift-format
        run: brew install swiftlint swift-format

      - name: SwiftLint
        run: swiftlint lint --strict

      - name: swift-format
        run: |
          swift-format lint --recursive --strict \
            Synchrony SynchronyTests SynchronyUITests \
            Packages/Synchrony/Sources Packages/Synchrony/Tests

      - name: Run SynchronyCore/Transport/Persistence/UI package tests
        run: |
          set -o pipefail
          swift test --package-path Packages/Synchrony --enable-code-coverage 2>&1 | tee test-results.log

      - name: Generate coverage report
        run: |
          set -o pipefail
          test_binary=$(find Packages/Synchrony/.build -path "*/debug/SynchronyPackageTests.xctest/Contents/MacOS/SynchronyPackageTests")
          profdata=$(find Packages/Synchrony/.build -name "default.profdata")
          xcrun llvm-cov report "$test_binary" \
            -instr-profile="$profdata" \
            --ignore-filename-regex='\.build|Tests/' \
            > coverage-report.txt
          cat coverage-report.txt

      - name: Build app for simulator
        run: |
          xcodebuild build \
            -project Synchrony.xcodeproj -scheme Synchrony \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results and coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: package-test-results
          path: |
            test-results.log
            coverage-report.txt
